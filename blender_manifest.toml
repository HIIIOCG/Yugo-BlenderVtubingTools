schema_version = "1.0.0"
id = "yugo"
version = "0.1.26"
name = "Yugo"
tagline = "Layered motion, camera control, and compositing for VRM avatars"
maintainer = "Yugo Contributors"
type = "add-on"

blender_version_min = "5.1.0"
license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Animation", "Rigging"]

[permissions]
network = "Receive VMC and iFacialMocap motion data"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.pyc",
  "*.zip",
  "/blender-download.*",
  "/dist/",
  "/.git/",
  "/.github/",
  "/scripts/",
  "/tests/",
]
