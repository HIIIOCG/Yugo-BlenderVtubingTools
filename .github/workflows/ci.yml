name: Validate extension

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check release metadata
        id: metadata
        run: |
          version=$(python scripts/check_version.py --print-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Blender 5.1
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.1"

      - name: Validate and build extension
        run: |
          mkdir -p dist
          blender --command extension validate addons/yugo
          blender --command extension build --source-dir addons/yugo --output-dir dist
          package="dist/yugo-${{ steps.metadata.outputs.version }}.zip"
          if [ "$(stat -c%s "$package")" -ge 52428800 ]; then
            echo "::error::Extension package is unexpectedly larger than 50 MiB"
            exit 1
          fi
          blender --command extension validate "$package"

      - name: Test relocated addon in isolated Blender processes
        run: python -B scripts/run_blender_tests.py --blender "$(command -v blender)" --task ci

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: yugo-${{ steps.metadata.outputs.version }}
          path: dist/yugo-${{ steps.metadata.outputs.version }}.zip
          if-no-files-found: error
