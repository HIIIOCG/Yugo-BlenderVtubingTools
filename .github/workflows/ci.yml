name: Validate extension

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check release metadata
        id: metadata
        run: |
          version=$(python scripts/check_version.py --print-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Blender 5.1
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.1"

      - name: Validate and build extension
        run: |
          blender --command extension validate
          blender --command extension build --output-dir dist
          blender --command extension validate dist/yugo-${{ steps.metadata.outputs.version }}.zip

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: yugo-${{ steps.metadata.outputs.version }}
          path: dist/yugo-${{ steps.metadata.outputs.version }}.zip
          if-no-files-found: error
