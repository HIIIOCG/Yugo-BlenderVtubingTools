name: Parallel development checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read

jobs:
  governance:
    name: Governance and workspace tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check management documents and package exclusions
        run: python -B scripts/check_governance.py
      - name: Test isolated workspace and scope guards
        run: python -B -m unittest discover -s tests/governance -p "test_*.py"

  scope:
    name: Canonical task scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          path: trusted-policy
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check canonical Issue and changed paths with base policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: candidate
        shell: bash
        run: |
          policy="$GITHUB_WORKSPACE/trusted-policy"
          if [ ! -f "$policy/scripts/check_pr_scope.py" ]; then
            echo "::error::Trusted scope policy is missing from this base"
            exit 1
          fi
          python -B "$policy/scripts/check_pr_scope.py" --policy-root "$policy"
