name: Publish GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python scripts/check_version.py --tag "$RELEASE_TAG" --print-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Blender 5.1
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.1"

      - name: Build and validate extension
        run: |
          mkdir -p dist
          blender --command extension validate
          blender --command extension build --output-dir dist
          package="dist/yugo-${{ steps.metadata.outputs.version }}.zip"
          if [ "$(stat -c%s "$package")" -ge 52428800 ]; then
            echo "::error::Extension package is unexpectedly larger than 50 MiB"
            exit 1
          fi
          blender --command extension validate "$package"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="dist/yugo-${{ steps.metadata.outputs.version }}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Existing releases are immutable; create a new product version"
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "$package" \
              --title "Yugo ${{ steps.metadata.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi
