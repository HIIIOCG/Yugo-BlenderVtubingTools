name: Publish GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python scripts/check_version.py --tag "$RELEASE_TAG" --print-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Blender 5.1
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.1"

      - name: Build and validate extension
        run: |
          mkdir -p dist
          blender --command extension validate
          blender --command extension build --output-dir dist
          blender --command extension validate dist/yugo-${{ steps.metadata.outputs.version }}.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/yugo-${{ steps.metadata.outputs.version }}.zip \
            --title "Yugo ${{ steps.metadata.outputs.version }}" \
            --generate-notes \
            --verify-tag
