name: Publish GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: yugo-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  platforms:
    uses: ./.github/workflows/yugo-platforms.yml
    permissions:
      contents: read

  release:
    needs: platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag, main ancestry and immutable release
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -B scripts/check_version.py --tag "$RELEASE_TAG" --print-version)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Existing releases are immutable; create a new product version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Blender 5.1
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "5.1"

      - name: Verify Git LFS payloads
        run: git lfs fsck

      - name: Build and validate extension
        uses: actions/download-artifact@v4
        with:
          name: yugo-platform-package-${{ github.sha }}
          path: dist

      - name: Validate the exact platform-qualified extension
        run: |
          blender --command extension validate addons/yugo
          package="dist/yugo-${{ steps.metadata.outputs.version }}.zip"
          if [ "$(stat -c%s "$package")" -ge 52428800 ]; then
            echo "::error::Extension package is unexpectedly larger than 50 MiB"
            exit 1
          fi
          blender --command extension validate "$package"

      - name: Build and verify the separate PhysX extension
        id: physx
        run: |
          python -B scripts/physx_build.py --blender "$(command -v blender)" --require-clean
          python - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          source = Path("addons/yugo_physx_tracker")
          manifest = tomllib.loads((source / "blender_manifest.toml").read_text(encoding="utf-8"))
          provenance = json.loads((source / "IMPORT_MANIFEST.json").read_text(encoding="utf-8"))
          record = json.loads(Path("dist/physx-build.json").read_text(encoding="utf-8"))
          assert manifest["id"] == "yugo_physx_tracker" and manifest["version"] == "0.4.0", "Unexpected PhysX package identity"
          assert manifest["platforms"] == ["windows-x64"], "PhysX native runtime platform changed"
          assert record["version"] == manifest["version"] and record["source_commit"] == os.environ["GITHUB_SHA"], "PhysX build is from another candidate"
          assert not record["source_dirty"], "PhysX source is not clean"
          for check in ("source_validate", "zip_validate", "import_hashes", "byte_comparison"):
              assert record[check] == "passed", f"PhysX verification failed: {check}"
          archive = Path("dist") / f"{manifest['id']}-{manifest['version']}.zip"
          assert Path(record["package"]).resolve() == archive.resolve(), "Unexpected PhysX output path"
          assert archive.stat().st_size == record["bytes"] and 200 * 1024**2 <= record["bytes"] <= 300 * 1024**2, "Unexpected PhysX package size"
          assert digest(archive) == record["sha256"], "PhysX ZIP checksum differs from build record"
          assert archive.with_suffix(".zip.sha256").read_text(encoding="utf-8") == f"{record['sha256']}  {archive.name}\n", "PhysX checksum sidecar differs"
          files = {path.relative_to(source).as_posix(): path for path in source.rglob("*") if path.is_file()
                   and not any(part in {"__pycache__", ".git", "tests", "reports"} for part in path.relative_to(source).parts)
                   and path.suffix not in {".pyc", ".pyo"}}
          assert len(files) == record["files"] == 2408, "PhysX source file set changed"
          lfs_files = subprocess.run(["git", "lfs", "ls-files", "--name-only"], capture_output=True, text=True, check=True).stdout.splitlines()
          lfs_files = [name for name in lfs_files if name.startswith("addons/yugo_physx_tracker/")]
          assert len(lfs_files) == 79, "PhysX Git LFS payload set changed"
          assert record["source_archive_sha256"] == provenance["archive_sha256"], "PhysX import provenance differs"
          record.update(package=archive.name, source=source.as_posix(), package_id=manifest["id"],
                        platforms=manifest["platforms"], blender_version_min=manifest["blender_version_min"],
                        runtime_mode=provenance["runtime_mode"], lfs_objects=len(lfs_files),
                        source_archive=provenance["source_archive"], source_archive_bytes=provenance["archive_bytes"],
                        import_manifest_sha256=digest(source / "IMPORT_MANIFEST.json"),
                        source_files_sha256={name: digest(path) for name, path in sorted(files.items())})
          Path("dist/physx-release-build.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package={archive.name}\n")
          PY

      - name: Verify package bytes and prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          source = Path("addons/yugo")
          archive = Path("dist") / f"yugo-{version}.zip"
          qualification = json.loads(Path("dist/platform-build.json").read_text(encoding="utf-8"))
          assert qualification["status"] == "passed" and qualification["source_commit"] == os.environ["GITHUB_SHA"], "Platform-qualified ZIP is from another candidate"
          assert not qualification["source_dirty"], "Qualified source was not clean"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == qualification["package_sha256"], "Published ZIP differs from the platform-qualified archive"
          expected = {path.relative_to(source).as_posix(): path for path in source.rglob("*") if path.is_file()}
          with zipfile.ZipFile(archive) as package:
              names = [name for name in package.namelist() if not name.endswith("/")]
              assert len(names) == len(set(names)) and set(names) == set(expected), "Package file set differs from source"
              assert package.testzip() is None, "Package ZIP is corrupt"
              for name in names:
                  assert package.read(name) == expected[name].read_bytes(), f"Package bytes differ: {name}"
          file_hashes = {name: hashlib.sha256(path.read_bytes()).hexdigest() for name, path in sorted(expected.items())}
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(".zip.sha256").write_text(f"{checksum}  {archive.name}\n", encoding="utf-8")
          record = {"version": version, "source_commit": os.environ["GITHUB_SHA"], "package": archive.name,
                    "package_sha256": checksum, "package_bytes": archive.stat().st_size,
                    "byte_comparison": "passed", "source_files_sha256": file_hashes,
                    "platforms": ["windows-x64", "linux-x64", "macos-arm64"],
                    "platform_qualification": "passed", "platform_build": qualification}
          Path("dist/release-build.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          changelog = (source / "CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          assert match, "Missing release changelog section"
          notes = match.group(1).split("\n[0.", 1)[0].strip()
          notes += f"\n\nSource commit: `{record['source_commit']}`\n\nSHA-256: `{checksum}`\n"
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yugo-release-validation
          path: |
            dist/*.zip
            dist/*.sha256
            dist/release-build.json
            dist/physx-build.json
            dist/physx-release-build.json
            dist/release-notes.md
            dist/physx-build/extension-*.log

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="dist/yugo-${{ steps.metadata.outputs.version }}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Existing releases are immutable; create a new product version"
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "$package" "$package.sha256" "dist/release-build.json" \
              "dist/${{ steps.physx.outputs.package }}" "dist/${{ steps.physx.outputs.package }}.sha256" "dist/physx-release-build.json" \
              --title "Yugo ${{ steps.metadata.outputs.version }}" \
              --notes-file dist/release-notes.md \
              --verify-tag
          fi
