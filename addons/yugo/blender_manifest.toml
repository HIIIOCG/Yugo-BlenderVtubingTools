schema_version = "1.0.0"
id = "yugo"
version = "0.1.26"
name = "Yugo"
tagline = "Avatar motion layers, nodes, physics, camera and compositing"
maintainer = "Yugo Contributors"
type = "add-on"

blender_version_min = "5.1.0"
license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Animation", "Rigging"]
platforms = ["windows-x64"]
wheels = [
  "./node/wheels/mujoco-3.3.7-cp313-cp313-win_amd64.whl",
  "./node/wheels/absl_py-2.5.0-py3-none-any.whl",
  "./node/wheels/etils-1.14.0-py3-none-any.whl",
  "./node/wheels/fsspec-2026.9.0-py3-none-any.whl",
  "./node/wheels/glfw-2.10.2-py2.py3-none-win_amd64.whl",
  "./node/wheels/pyopengl-3.1.10-py3-none-any.whl",
  "./node/wheels/typing_extensions-4.16.0-py3-none-any.whl",
  "./node/wheels/zipp-4.1.1-py3-none-any.whl",
]

[permissions]
network = "Receive motion/chat data and download chat avatar images"
files = "Export Spring simulation comparison recordings as JSON"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.pyc",
  "*.zip",
  "/blender-download.*",
  "/dist/",
  "/.git/",
  "/.github/",
  "/scripts/",
  "/tests/",
  "/docs/",
  "/AGENTS.md",
]
